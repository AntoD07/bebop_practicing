# Fly.io fallback for the compute API (always on, ~$2–5/mo).
#   fly launch --no-deploy --copy-config && fly secrets set BEBOP_API_KEY=... ANTHROPIC_API_KEY=... && fly deploy
app = "bebop-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  BEBOP_MAX_LAYOUTS = "10000"
  BEBOP_TIME_BUDGET_MS = "20000"
  BEBOP_ALLOWED_ORIGINS = "https://YOUR-APP.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/py/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
